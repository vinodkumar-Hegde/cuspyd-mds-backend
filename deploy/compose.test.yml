# TEST ONLY. No host DB port, persistent volumes, real mail or application data.
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mdslate_test
      POSTGRES_USER: mdslate_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdslate_test -d mdslate_test"]
      interval: 1s
      timeout: 2s
      retries: 30
  test:
    build:
      context: ..
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://mdslate_test:test-only-password@test-db:5432/mdslate_test
      DATABASE_URL: postgresql+psycopg://mdslate_test:test-only-password@test-db:5432/mdslate_test
      JWT_SECRET: isolated-test-jwt-secret-not-for-production
      OTP_SECRET: isolated-test-otp-secret-not-for-production
    depends_on:
      test-db:
        condition: service_healthy
